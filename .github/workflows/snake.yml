name: GitHub Snake Game

on:
  # Her gece gece yarısı otomatik çalışır
  schedule:
    - cron: "0 0 * * *"

  # Manuel olarak başlatmaya izin verir
  workflow_dispatch:

  # Main branch'ine bir push yapıldığında çalışır
  push:
    branches:
      - main

# Aynı anda birden fazla run'ın output branch'ine yarışarak yazmasını engeller
concurrency:
  group: snake-game
  cancel-in-progress: true

jobs:
  generate:
    permissions:
      contents: write  # Dosyaları branch'e yazabilmek için bu izin kritik
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # Step 1: Depoyu kontrol et
      - name: Checkout Repository
        uses: actions/checkout@v7

      # Step 2: Yılan animasyonlarını oluştur (açık/koyu tema, marka renkleriyle)
      - name: Generate GitHub Contributions Snake Animations
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#0A66C2&color_dots=#ebedf0,#9be9a8,#40c463,#30a14e,#216e39
            dist/github-snake-dark.svg?color_snake=#00f0ff&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Step 3: Oluşturulan dosyaları 'output' branch'ine yükle
      - name: Deploy to Output Branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
          commit_message: "Update GitHub Snake animation [skip ci]"
